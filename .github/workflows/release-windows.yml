name: Windows release

# Tag-driven: pushing v1.2.3 builds that version and attaches the installer to
# a GitHub Release. The tag is the only place a version number is written; the
# installer takes its own from here rather than from a second copy in the .iss.
on:
  push:
    tags: ['v*']
  # So the build can be exercised without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned, not `stable`. A floating channel means the toolchain can
          # change under a release that is being cut, and the first anyone
          # knows is a failed build with a version number already attached.
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # Cheap, and it fails the release before spending ten minutes on a build
      # that was never going to be worth publishing.
      - name: Analyze
        run: flutter analyze

      # `-x golden` per dart_test.yaml: the deck-screen goldens were rendered
      # on Linux and pin layout rather than glyphs, so a difference here would
      # be the runner's font stack rather than a regression. They still run on
      # the machine that generates them.
      - name: Test
        run: flutter test -x golden

      - name: Build
        run: flutter build windows --release

      - name: Version from the tag
        id: version
        shell: bash
        run: |
          # v1.2.3 -> 1.2.3. A manual run has no tag, so it is stamped 0.0.0
          # rather than borrowing a number that means something.
          ref="${GITHUB_REF#refs/tags/}"
          if [[ "$ref" == v* ]]; then
            echo "value=${ref#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      # Present on the windows-latest image today, installed if that changes.
      # A release that fails on a missing build tool is a bad way to find out.
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup is not where it was expected: $iscc"
          }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build the installer
        shell: pwsh
        run: >
          & "$env:ISCC"
          /DAppVersion=${{ steps.version.outputs.value }}
          windows\packaging\sayaw.iss

      - uses: actions/upload-artifact@v4
        with:
          name: sayaw-windows-installer
          path: windows/packaging/Output/*.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: windows/packaging/Output/*.exe
          draft: true
          body: |
            **This installer is not code-signed.** Windows SmartScreen will
            warn on first run: choose **More info** then **Run anyway**.

            Requires 64-bit Windows 10 or later. Everything it needs is in the
            installer, including the audio and database libraries.
